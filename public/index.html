<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScope — כלי בדיקות אבטחה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #0c0804;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --border-bright: rgba(255,255,255,0.14);
      --text: #f0ece8;
      --text-muted: #7a6e68;
      --text-dim: #3d3530;
      --accent: #ef5123;
      --accent-light: #ff7a52;
      --accent-dim: rgba(239,81,35,0.12);
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(239,81,35,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239,81,35,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* radial glow */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 70vw;
      height: 50vh;
      background: radial-gradient(ellipse, rgba(239,81,35,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; position: relative; z-index: 1; }

    /* ── HEADER ── */
    header { padding: 52px 0 44px; text-align: center; }

    .logo-wrap {
      display: inline-block;
      margin-bottom: 28px;
    }

    .logo-wrap svg {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(239,81,35,0.25));
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(239,81,35,0.25);
      padding: 5px 14px;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .logo-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    h1 {
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.12;
      background: linear-gradient(135deg, #fff 25%, #f5c4b3 60%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 400;
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.65;
    }

    /* ── SEARCH ── */
    .search-wrap { max-width: 660px; margin: 36px auto 0; }

    .search-box {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .search-box:focus-within {
      border-color: rgba(239,81,35,0.55);
      box-shadow: 0 0 0 3px rgba(239,81,35,0.1), 0 0 28px rgba(239,81,35,0.07);
    }

    .search-icon {
      display: flex;
      align-items: center;
      padding: 0 14px 0 18px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-box input {
      flex: 1;
      padding: 15px 4px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      font-family: var(--mono);
      outline: none;
      direction: ltr;
      min-width: 0;
    }

    .search-box input::placeholder { color: var(--text-dim); }

    .btn-scan {
      padding: 13px 26px;
      background: linear-gradient(135deg, var(--accent), #c73e18);
      color: #fff;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Heebo', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }

    .btn-scan:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      box-shadow: 0 0 20px rgba(239,81,35,0.4);
    }

    .btn-scan:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── ERROR ── */
    .error-msg { display: none; background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; padding: 11px 16px; border-radius: 10px; margin-top: 12px; font-size: 0.9rem; text-align: center; }
    .error-msg.active { display: block; }

    /* ── TERMINAL ── */
    .terminal { display: none; margin-top: 36px; background: rgba(0,0,0,0.45); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .terminal.active { display: block; }

    .terminal-bar { display: flex; align-items: center; gap: 7px; padding: 11px 15px; background: rgba(255,255,255,0.025); border-bottom: 1px solid var(--border); }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
    .t-red { background: #ff5f56; } .t-yellow { background: #ffbd2e; } .t-green { background: #27c93f; }
    .terminal-title { margin-right: auto; font-size: 0.77rem; color: var(--text-muted); font-family: var(--mono); }

    .terminal-body { padding: 18px 22px; font-family: var(--mono); font-size: 0.81rem; line-height: 1.85; min-height: 150px; }

    .t-line { display: flex; align-items: center; gap: 9px; opacity: 0; animation: fadeIn 0.25s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .t-spinner { width: 11px; height: 11px; border: 2px solid rgba(239,81,35,0.25); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESULTS ── */
    #results { display: none; margin-top: 44px; }
    #results.active { display: block; }

    /* PDF button */
    .pdf-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }

    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: rgba(239,81,35,0.1);
      border: 1px solid rgba(239,81,35,0.3);
      border-radius: 10px;
      color: var(--accent-light);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Heebo', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-pdf:hover { background: rgba(239,81,35,0.18); box-shadow: 0 0 14px rgba(239,81,35,0.2); }

    /* score hero */
    .score-hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 36px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 36px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .score-hero::before {
      content: '';
      position: absolute;
      top: -50%; right: -8%;
      width: 280px; height: 280px;
      background: radial-gradient(circle, var(--hero-glow, rgba(239,81,35,0.08)) 0%, transparent 70%);
      pointer-events: none;
    }

    .score-ring-wrap { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
    .score-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .score-ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 8; }
    .score-ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 339; stroke-dashoffset: 339; transition: stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1), stroke 0.5s; }

    .score-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: 800; line-height: 1; }
    .score-num small { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

    .score-info h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 7px; }
    .target-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 4px 11px; border-radius: 7px; font-family: var(--mono); font-size: 0.8rem; color: var(--accent-light); margin-bottom: 18px; direction: ltr; }

    .stat-row { display: flex; gap: 18px; flex-wrap: wrap; }
    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-item .val { font-size: 1.3rem; font-weight: 700; }
    .stat-item .lbl { font-size: 0.75rem; color: var(--text-muted); }

    /* ── CARDS ── */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
    .card:hover { border-color: rgba(239,81,35,0.25); transform: translateY(-2px); }

    .card-header { display: flex; align-items: center; gap: 11px; padding: 16px 18px; cursor: pointer; user-select: none; }
    .card-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .card-title { flex: 1; font-weight: 600; font-size: 0.92rem; }
    .card-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.73rem; font-weight: 700; }

    .badge-safe { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
    .badge-warn { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
    .badge-danger { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    .badge-info { background: rgba(239,81,35,0.1); color: var(--accent-light); border: 1px solid rgba(239,81,35,0.2); }

    .card-chevron { color: var(--text-dim); transition: transform 0.3s; flex-shrink: 0; }
    .card.open .card-chevron { transform: rotate(180deg); }

    .card-body { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }
    .card.open .card-body { display: block; }

    .check-row { display: flex; gap: 11px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .check-row:last-child { border-bottom: none; }

    .check-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; flex-shrink: 0; margin-top: 1px; }
    .ci-safe { background: rgba(16,185,129,0.13); color: #34d399; }
    .ci-fail { background: rgba(239,68,68,0.13); color: #f87171; }
    .ci-warn { background: rgba(245,158,11,0.13); color: #fbbf24; }
    .ci-info { background: rgba(239,81,35,0.1); color: var(--accent-light); }

    .check-text h4 { font-size: 0.86rem; font-weight: 600; margin-bottom: 2px; }
    .check-text p { font-size: 0.79rem; color: var(--text-muted); line-height: 1.5; }
    .code-chip { display: inline-block; font-family: var(--mono); font-size: 0.73rem; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 2px 7px; border-radius: 5px; color: var(--accent-light); margin-top: 4px; word-break: break-all; direction: ltr; text-align: left; }

    .info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 9px; margin-bottom: 12px; padding-top: 12px; }
    .info-cell { background: rgba(0,0,0,0.22); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
    .info-cell label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 3px; }
    .info-cell span { font-size: 0.86rem; font-weight: 600; direction: ltr; display: block; text-align: left; }

    .port-list { display: flex; flex-direction: column; gap: 7px; padding-top: 12px; }
    .port-row { display: flex; align-items: center; gap: 11px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
    .port-num { font-family: var(--mono); font-size: 0.88rem; font-weight: 700; min-width: 48px; direction: ltr; }
    .port-info { flex: 1; }
    .port-info strong { font-size: 0.83rem; }
    .port-info p { font-size: 0.76rem; color: var(--text-muted); margin-top: 1px; }

    .tech-wrap { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 12px; }
    .tech-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-dim); border: 1px solid rgba(239,81,35,0.2); color: var(--accent-light); padding: 4px 11px; border-radius: 7px; font-size: 0.78rem; font-weight: 600; }

    .threat-meter-wrap { padding-top: 14px; margin-bottom: 14px; }
    .threat-label { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 0.8rem; color: var(--text-muted); }
    .threat-bar-bg { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.05); overflow: hidden; }
    .threat-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }

    .footer { text-align: center; color: var(--text-dim); font-size: 0.78rem; margin-top: 50px; }

    /* ── PRINT / PDF ── */
    @media print {
      body { background: #fff !important; color: #000 !important; }
      body::before, body::after { display: none; }
      .search-wrap, .terminal, .pdf-bar, .btn-pdf, header { display: none !important; }
      .card { break-inside: avoid; border: 1px solid #ddd !important; }
      .card-body { display: block !important; }
      #results { display: block !important; }
    }

    @media (max-width: 640px) {
      .score-hero { grid-template-columns: 1fr; text-align: center; padding: 24px 20px; }
      .score-ring-wrap { margin: 0 auto; }
      .stat-row { justify-content: center; }
      .cards-grid { grid-template-columns: 1fr; }
      .info-grid { grid-template-columns: 1fr; }
      .search-box { flex-direction: column; border-radius: 14px; }
      .btn-scan { border-radius: 0 0 12px 12px; padding: 14px; }
    }
  </style>
</head>

    <h1>בדיקות אבטחה<br>מקצועיות לאתרים</h1>
    <p class="subtitle">סריקה מלאה: Headers · SSL · DNS · פורטים · טכנולוגיות · איתור נוזקות</p>
  </header>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </span>
      <input type="text" id="urlInput" placeholder="example.com" autocomplete="off" spellcheck="false">
      <button class="btn-scan" id="scanBtn" onclick="startScan()">סרוק עכשיו</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="terminal" id="terminal">
    <div class="terminal-bar">
      <span class="terminal-dot t-red"></span>
      <span class="terminal-dot t-yellow"></span>
      <span class="terminal-dot t-green"></span>
      <span class="terminal-title">securescope — scan</span>
    </div>
    <div class="terminal-body" id="terminalBody"></div>
  </div>

  <div id="results">
    <div class="pdf-bar">
      <button class="btn-pdf" onclick="downloadPdf()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        הורד דוח PDF
      </button>
    </div>
    <div id="pdf-content">
      <div class="score-hero" id="scoreHero"></div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
    <div class="footer" id="footer"></div>
  </div>
</div>

<script>
  document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') startScan(); });

  const STEPS = [
    'בודק Security Headers...',
    'מנתח תעודת SSL/TLS...',
    'סורק רשומות DNS...',
    'מזהה טכנולוגיות...',
    'סורק פורטים פתוחים...',
    'בודק נוזקות ואיומים...',
  ];

  function esc(t) {
    if (!t) return '';
    const d = document.createElement('div');
    d.textContent = String(t);
    return d.innerHTML;
  }

  function scoreColor(s) { return s >= 75 ? '#10b981' : s >= 45 ? '#f59e0b' : '#ef4444'; }
  function scoreLabel(s) { return s >= 75 ? 'בטוח' : s >= 45 ? 'בינוני' : 'בסיכון'; }
  function badgeClass(s) { return s >= 75 ? 'badge-safe' : s >= 45 ? 'badge-warn' : 'badge-danger'; }
  function chevron() { return `<svg class="card-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>`; }

  function showTerminal(url) {
    const terminal = document.getElementById('terminal');
    const body = document.getElementById('terminalBody');
    terminal.classList.add('active');
    body.innerHTML = `<div class="t-line" style="color:#ef5123">$ securescope scan <span style="color:#ff7a52;font-family:monospace">${esc(url)}</span></div>`;
    STEPS.forEach((label, i) => {
      setTimeout(() => {
        body.innerHTML += `<div class="t-line" style="color:#f0ece8"><span class="t-spinner"></span> ${label}</div>`;
      }, i * 480 + 180);
    });
  }

  function hideTerminal() { document.getElementById('terminal').classList.remove('active'); }

  async function startScan() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;
    const errorMsg = document.getElementById('errorMsg');
    const results = document.getElementById('results');
    const scanBtn = document.getElementById('scanBtn');
    errorMsg.classList.remove('active');
    results.style.display = 'none';
    scanBtn.disabled = true;
    scanBtn.textContent = 'סורק...';
    showTerminal(url);
    try {
      const resp = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Scan failed');
      hideTerminal();
      renderResults(data);
      results.style.display = 'block';
    } catch (err) {
      hideTerminal();
      errorMsg.textContent = err.message || 'שגיאה בסריקה. נסה שוב.';
      errorMsg.classList.add('active');
    } finally {
      scanBtn.disabled = false;
      scanBtn.textContent = 'סרוק עכשיו';
    }
  }

  // ── PDF EXPORT ──
  function downloadPdf() {
    const target = document.getElementById('urlInput').value.trim() || 'scan';
    const filename = `securescope-${target.replace(/[^a-z0-9]/gi,'-')}.pdf`;
    const el = document.getElementById('pdf-content');

    const opt = {
      margin: [10, 10, 10, 10],
      filename,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#0c0804' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all', 'css'] },
    };

    // Open all cards for PDF
    document.querySelectorAll('.card').forEach(c => c.classList.add('open'));

    const btn = document.querySelector('.btn-pdf');
    btn.textContent = 'מייצר PDF...';
    btn.disabled = true;

    html2pdf().set(opt).from(el).save().then(() => {
      btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> הורד דוח PDF`;
      btn.disabled = false;
    });
  }

  // ── RENDER ──
  function renderResults(data) {
    const scores = [];
    if (data.headers?.score != null) scores.push(data.headers.score);
    if (data.ssl?.score != null)     scores.push(data.ssl.score);
    if (data.dns?.score != null)     scores.push(data.dns.score);
    if (data.ports?.score != null)   scores.push(data.ports.score);
    if (data.malware?.score != null) scores.push(data.malware.score);
    const overall = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
    const color = scoreColor(overall);
    const offset = 339 - (overall/100)*339;
    const glowRgb = overall>=75?'16,185,129':overall>=45?'245,158,11':'239,68,68';

    const hero = document.getElementById('scoreHero');
    hero.style.setProperty('--hero-glow', `rgba(${glowRgb},0.1)`);
    hero.innerHTML = `
      <div class="score-ring-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="score-ring-bg" cx="60" cy="60" r="54"/>
          <circle class="score-ring-fill" id="scoreRing" cx="60" cy="60" r="54" stroke="${color}"/>
        </svg>
        <div class="score-num" style="color:${color}">
          <span id="scoreCounter">0</span>
          <small>${scoreLabel(overall)}</small>
        </div>
      </div>
      <div class="score-info">
        <h2>ציון אבטחה כולל</h2>
        <div class="target-chip">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          ${esc(data.target)}
        </div>
        <div class="stat-row">
          ${data.headers?.passed!=null?`<div class="stat-item"><span class="val" style="color:#10b981">${data.headers.passed}/${data.headers.totalChecks}</span><span class="lbl">Headers</span></div>`:''}
          ${data.ssl?.valid!=null?`<div class="stat-item"><span class="val" style="color:${data.ssl.valid?'#10b981':'#ef4444'}">${data.ssl.valid?'תקין':'לא תקין'}</span><span class="lbl">SSL</span></div>`:''}
          ${data.ports?.openPorts!=null?`<div class="stat-item"><span class="val" style="color:${data.ports.openPorts>3?'#f59e0b':'#10b981'}">${data.ports.openPorts}</span><span class="lbl">פורטים פתוחים</span></div>`:''}
          ${data.malware?.threatLevel!=null?`<div class="stat-item"><span class="val" style="color:${data.malware.threatLevel==='safe'?'#10b981':data.malware.threatLevel==='suspicious'?'#f59e0b':'#ef4444'}">${data.malware.threatLevel==='safe'?'נקי':data.malware.threatLevel==='suspicious'?'חשוד':'זדוני'}</span><span class="lbl">נוזקות</span></div>`:''}
        </div>
      </div>`;

    setTimeout(() => {
      document.getElementById('scoreRing').style.strokeDashoffset = offset;
      animateCount('scoreCounter', 0, overall, 1100);
    }, 50);

    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = '';
    if (data.malware && !data.malware.error) grid.innerHTML += renderMalwareCard(data.malware);
    if (data.headers && !data.headers.error) grid.innerHTML += renderHeadersCard(data.headers);
    if (data.ssl && !data.ssl.error)         grid.innerHTML += renderSslCard(data.ssl);
    if (data.dns && !data.dns.error)         grid.innerHTML += renderDnsCard(data.dns);
    if (data.ports && !data.ports.error)     grid.innerHTML += renderPortsCard(data.ports);
    if (data.tech && !data.tech.error)       grid.innerHTML += renderTechCard(data.tech);

    document.querySelectorAll('.card-header').forEach(h => {
      h.addEventListener('click', () => h.parentElement.classList.toggle('open'));
    });

    document.getElementById('footer').textContent = `סריקה בוצעה: ${new Date(data.timestamp).toLocaleString('he-IL')}`;
  }

  function animateCount(id, from, to, duration) {
    const el = document.getElementById(id);
    if (!el) return;
    const start = performance.now();
    (function step(now) {
      const t = Math.min((now-start)/duration,1);
      el.textContent = Math.round(from+(to-from)*(1-Math.pow(1-t,3)));
      if (t<1) requestAnimationFrame(step);
    })(performance.now());
  }

  function renderMalwareCard(m) {
    const color = m.threatLevel==='safe'?'#10b981':m.threatLevel==='suspicious'?'#f59e0b':'#ef4444';
    const label = m.threatLevel==='safe'?'נקי':m.threatLevel==='suspicious'?'חשוד':'זדוני';
    const bclass = m.threatLevel==='safe'?'badge-safe':m.threatLevel==='suspicious'?'badge-warn':'badge-danger';
    const glowRgb = m.threatLevel==='safe'?'16,185,129':m.threatLevel==='suspicious'?'245,158,11':'239,68,68';
    let rows='';
    for(const r of (m.results||[])){
      const ci=r.status==='safe'?'ci-safe':r.status==='danger'?'ci-fail':r.status==='warning'?'ci-warn':'ci-info';
      const icon=r.status==='safe'?'✓':r.status==='danger'?'✗':r.status==='warning'?'⚠':'ℹ';
      const details=Array.isArray(r.detail)&&r.detail.length?`<p>${r.detail.map(esc).join(' · ')}</p>`:'';
      rows+=`<div class="check-row"><div class="check-icon ${ci}">${icon}</div><div class="check-text"><h4>${esc(r.check)}</h4><p>${esc(r.message)}</p>${details}</div></div>`;
    }
    return `<div class="card open">
      <div class="card-header">
        <div class="card-icon" style="background:rgba(${glowRgb},0.12)">🛡️</div>
        <span class="card-title">בדיקת נוזקות ואיומים</span>
        <span class="card-badge ${bclass}">${label}</span>${chevron()}
      </div>
      <div class="card-body">
        <div class="threat-meter-wrap">
          <div class="threat-label"><span>רמת ביטחון</span><span style="color:${color}">${m.score}%</span></div>
          <div class="threat-bar-bg"><div class="threat-bar-fill" style="width:${m.score}%;background:${color}"></div></div>
        </div>${rows}
      </div></div>`;
  }

  function renderHeadersCard(h){
    let rows='';
    for(const r of h.results){
      rows+=`<div class="check-row"><div class="check-icon ${r.present?'ci-safe':'ci-fail'}">${r.present?'✓':'✗'}</div><div class="check-text"><h4>${esc(r.header)}</h4><p>${esc(r.description)}</p>${r.value?`<span class="code-chip">${esc(r.value)}</span>`:''}</div></div>`;
    }
    let leaks='';
    for(const l of (h.infoLeaks||[])){
      leaks+=`<div class="check-row"><div class="check-icon ci-warn">⚠</div><div class="check-text"><h4>חשיפת מידע: ${esc(l.header)}</h4><span class="code-chip">${esc(l.value)}</span></div></div>`;
    }
    return `<div class="card open"><div class="card-header"><div class="card-icon" style="background:rgba(239,81,35,0.1)">🔐</div><span class="card-title">Security Headers</span><span class="card-badge ${badgeClass(h.score)}">${h.score}%</span>${chevron()}</div><div class="card-body">${rows}${leaks}</div></div>`;
  }

  function renderSslCard(ssl){
    let issues='';
    for(const i of (ssl.issues||[])){
      issues+=`<div class="check-row"><div class="check-icon ${i.severity==='high'?'ci-fail':'ci-warn'}">${i.severity==='high'?'✗':'⚠'}</div><div class="check-text"><h4>${esc(i.message)}</h4></div></div>`;
    }
    return `<div class="card"><div class="card-header"><div class="card-icon" style="background:rgba(16,185,129,0.1)">🔒</div><span class="card-title">SSL / TLS</span><span class="card-badge ${badgeClass(ssl.score)}">${ssl.score}%</span>${chevron()}</div>
    <div class="card-body"><div class="info-grid">
      <div class="info-cell"><label>תקף</label><span style="color:${ssl.valid?'#10b981':'#ef4444'}">${ssl.valid?'✓ כן':'✗ לא'}</span></div>
      <div class="info-cell"><label>פרוטוקול</label><span>${esc(ssl.protocol||'N/A')}</span></div>
      <div class="info-cell"><label>ימים לפקיעה</label><span style="color:${ssl.daysUntilExpiry>30?'#10b981':ssl.daysUntilExpiry>0?'#f59e0b':'#ef4444'}">${ssl.daysUntilExpiry}</span></div>
      <div class="info-cell"><label>מנפיק</label><span>${esc(ssl.issuer?.O||ssl.issuer?.CN||'N/A')}</span></div>
      <div class="info-cell"><label>צופן</label><span>${esc(ssl.cipher?.name||'N/A')}</span></div>
      <div class="info-cell"><label>תוקף עד</label><span>${ssl.validTo?new Date(ssl.validTo).toLocaleDateString('he-IL'):'N/A'}</span></div>
    </div>${issues}</div></div>`;
  }

  function renderDnsCard(dns){
    let secRows='';
    for(const r of (dns.securityRecords||[])){
      secRows+=`<div class="check-row"><div class="check-icon ${r.present?'ci-safe':'ci-fail'}">${r.present?'✓':'✗'}</div><div class="check-text"><h4>${esc(r.type)}</h4><p>${esc(r.description)}</p>${r.value&&typeof r.value==='string'?`<span class="code-chip">${esc(r.value)}</span>`:''}</div></div>`;
    }
    return `<div class="card"><div class="card-header"><div class="card-icon" style="background:rgba(239,81,35,0.08)">🌐</div><span class="card-title">DNS</span><span class="card-badge ${badgeClass(dns.score)}">${dns.score}%</span>${chevron()}</div>
    <div class="card-body"><div class="info-grid">
      <div class="info-cell"><label>IPv4</label><span>${(dns.ipv4||[]).join(', ')||'N/A'}</span></div>
      <div class="info-cell"><label>IPv6</label><span>${(dns.ipv6||[]).join(', ')||'N/A'}</span></div>
      <div class="info-cell"><label>Name Servers</label><span>${(dns.ns||[]).slice(0,2).join(', ')||'N/A'}</span></div>
      <div class="info-cell"><label>MX Records</label><span>${(dns.mx||[]).map(m=>m.exchange).slice(0,2).join(', ')||'N/A'}</span></div>
    </div>${secRows}</div></div>`;
  }

  function renderPortsCard(ports){
    const open=(ports.results||[]).filter(p=>p.status==='open');
    let portRows=open.length?'<div class="port-list">':'<p style="color:var(--text-muted);padding:12px 0;font-size:0.83rem">לא נמצאו פורטים פתוחים</p>';
    for(const p of open){
      const c=p.risk==='high'?'#ef4444':p.risk==='medium'?'#f59e0b':'#10b981';
      portRows+=`<div class="port-row"><span class="port-num" style="color:${c}">${p.port}</span><div class="port-info"><strong>${esc(p.service)}</strong><p>${esc(p.description)}</p></div><span class="card-badge ${p.risk==='high'?'badge-danger':p.risk==='medium'?'badge-warn':'badge-safe'}">${p.risk||'low'}</span></div>`;
    }
    if(open.length) portRows+='</div>';
    let warns='';
    for(const w of (ports.warnings||[])){
      warns+=`<div class="check-row"><div class="check-icon ci-fail">⚠</div><div class="check-text"><h4>${esc(w.message)}</h4></div></div>`;
    }
    return `<div class="card"><div class="card-header"><div class="card-icon" style="background:rgba(245,158,11,0.1)">🔌</div><span class="card-title">סריקת פורטים</span><span class="card-badge ${badgeClass(ports.score)}">${ports.openPorts} פתוחים</span>${chevron()}</div><div class="card-body">${warns}${portRows}</div></div>`;
  }

  function renderTechCard(tech){
    let tags=(tech.detected||[]).map(t=>`<span class="tech-tag">⚙ ${esc(t.technology)}</span>`).join('');
    if(!tags) tags='<p style="color:var(--text-muted);font-size:0.83rem">לא זוהו טכנולוגיות ספציפיות</p>';
    let concerns='';
    for(const c of (tech.concerns||[])){
      concerns+=`<div class="check-row"><div class="check-icon ci-warn">⚠</div><div class="check-text"><h4>${esc(c.message)}</h4></div></div>`;
    }
    return `<div class="card"><div class="card-header"><div class="card-icon" style="background:rgba(239,81,35,0.08)">⚙️</div><span class="card-title">זיהוי טכנולוגיות</span><span class="card-badge badge-info">${tech.totalDetected} זוהו</span>${chevron()}</div><div class="card-body">${concerns}<div class="tech-wrap">${tags}</div></div></div>`;
  }
</script>
</body>
</html>
